name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: flake8 .
      - run: pytest -q
      - name: Shellcheck the bash labs
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck labs/bash/*.sh
